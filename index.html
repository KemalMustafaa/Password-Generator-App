<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>
        Generate a <br />
        <span>Random Password</span>
      </h1>
      <div class="display">
        <input type="text" name="text" id="password" placeholder="Password" />
        <img src="Image/copy.png" alt="copy-button" />
      </div>
      <button onclick="createPassword()">
        <img src="Image/generate.png" alt="generate-button" />
        Generate Password
      </button>
    </div>

    <script src="main.js"></script>
  </body>
</html>
